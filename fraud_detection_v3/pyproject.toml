[project]
name = "fraud-detection-v3"
version = "0.1.0"
description = "Real-time Fraud Detection System with MLOps and XAI"
authors = [
    {name = "TejasweeSulekh", email = "20d070082@iitb.ac.in"}
]
readme = "README.md"
requires-python = ">=3.10,<3.13" 

[tool.poetry]
# Note: Poetry uses this section for dependency resolution
name = "fraud-detection-v3"
version = "0.1.0"
description = ""
authors = ["TejasweeSulekh <20d070082@iitb.ac.in>"]

[tool.poetry.dependencies]
python = ">=3.10,<3.13"
xgboost = "^2.0.3"
mlflow = "^2.14.1"
fastapi = "^0.109.0"
uvicorn = {extras = ["standard"], version = "^0.27.0"}
shap = "^0.44.0"
scikit-learn = "^1.5.0"
pandas = "^2.2.0"
numpy = "<2.0.0"
requests = "^2.31.0"

# Future-proofing: Adding clients for Redis and Kafka now so we don't rebuild later
redis = "^5.0.1"
confluent-kafka = "^2.3.0" 

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"