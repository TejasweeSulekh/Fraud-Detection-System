version: '3.8'

services:
  # --- 1. ML FLOW SERVER (The Backbone) ---
  mlflow-server:
      build:
        context: .
        dockerfile: Dockerfile.mlflow
      container_name: mlflow-server
      ports:
        - "5000:5000"
      environment:
        - MLFLOW_TRACKING_URI=http://localhost:5000
      volumes:
        - ./mlruns:/app/mlruns                
        - ./mlflow_store:/app/backend_store    
      command: >
        mlflow server
        --backend-store-uri sqlite:////app/backend_store/mlflow.db
        --default-artifact-root /app/mlruns
        --host 0.0.0.0
        --port 5000
      networks:
        - fraud-network
      restart: always
      # ADD THIS HEALTHCHECK
      healthcheck:
        test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
        interval: 10s
        timeout: 5s
        retries: 5

  # --- 2. MODEL TRAINING (Runs once then dies) ---
  init-model:
    build: .
    container_name: fraud-init-model
    command: python src/train_in_docker.py
    environment:
      # MUST point to the container name, not localhost
      - MLFLOW_TRACKING_URI=http://mlflow-server:5000
    volumes:
      - ./src:/app/src
      - ./mlruns:/app/mlruns
      - ./data:/app/data
    depends_on:
      mlflow-server:
        condition: service_healthy  # WAITS FOR MLFLOW TO BE READY
    networks:
      - fraud-network

  # --- 3. INFERENCE API ---
  inference-service:
    build: .
    container_name: fraud-inference-service
    ports:
      - "8000:8000"
    environment:
      - MLFLOW_TRACKING_URI=http://mlflow-server:5000
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - DATABASE_URL=postgresql://fraud_user:fraud_pass@postgres:5432/fraud_db
    volumes:
      - ./src:/app/src
      - ./mlruns:/app/mlruns
      - ./data:/app/data
    depends_on:
      init-model:
        condition: service_completed_successfully # WAITS FOR TRAINING TO FINISH
      redis:
        condition: service_started
      kafka:
        condition: service_started
      postgres:
        condition: service_started
    networks:
      - fraud-network

  # --- 4. CONSUMER ---
  consumer:
    build: .
    container_name: fraud-consumer
    command: python src/consumer.py
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      # Fix: Use correct container name
      - INFERENCE_API_URL=http://inference-service:8000/predict
    depends_on:
      kafka:
        condition: service_started
      inference-service:
        condition: service_started
    networks:
      - fraud-network

  # --- 5. PRODUCER ---
  producer:
    build: .
    container_name: fraud-producer
    command: python src/producer.py
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
    depends_on:
      kafka:
        condition: service_started
    networks:
      - fraud-network

  # --- 6. INFRASTRUCTURE ---
  postgres:
    image: postgres:15-alpine
    container_name: postgres_db
    environment:
      POSTGRES_USER: fraud_user
      POSTGRES_PASSWORD: fraud_pass
      POSTGRES_DB: fraud_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - fraud-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fraud_user -d fraud_db"]
      interval: 5s
      retries: 5

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - fraud-network

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks:
      - fraud-network
    healthcheck:
      test: nc -z localhost 9092 || exit -1
      interval: 10s
      timeout: 5s
      retries: 5

  # --- 7. DASHBOARD ---
  dashboard:
    build: .
    container_name: fraud-dashboard
    command: streamlit run src/dashboard.py --server.port 8501 --server.address 0.0.0.0
    ports:
      - "8501:8501"
    environment:
      - DATABASE_URL=postgresql://fraud_user:fraud_pass@postgres:5432/fraud_db
      # Fix: Use correct service name
      - API_URL=http://inference-service:8000
    volumes:
      - ./src:/app/src
    depends_on:
      inference-service:
        condition: service_started
      postgres:
        condition: service_healthy
    networks:
      - fraud-network

  redis:
    image: redis:7.2-bookworm
    container_name: redis
    ports:
      - "6379:6379"
    networks:
      - fraud-network

volumes:
  postgres_data:

networks:
  fraud-network:
    driver: bridge