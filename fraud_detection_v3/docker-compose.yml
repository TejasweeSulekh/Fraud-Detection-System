version: '3.8'

services:
  # --- MAIN API SERVICE (Merged inference-service + web_api) ---
  inference-service:
    build: .
    container_name: fraud-inference-service
    ports:
      - "8000:8000"  # HOST:CONTAINER (We use 8000 to avoid conflict with MLflow's 5000)
    environment:
      - MLFLOW_TRACKING_URI=http://mlflow-server:5000
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - DATABASE_URL=postgresql://fraud_user:fraud_pass@postgres:5432/fraud_db
    volumes:
      - ./src:/app/src       # Maps code for live reloading
      - ./mlruns:/app/mlruns # Maps local models
    depends_on:
      - mlflow-server
      - redis
      - kafka
      - postgres
    networks:
      - fraud-network

  postgres:
    image: postgres:15-alpine
    container_name: postgres_db
    environment:
      POSTGRES_USER: fraud_user
      POSTGRES_PASSWORD: fraud_pass
      POSTGRES_DB: fraud_db
    ports:
      - "5432:5432" # Exposed so you can check it with a GUI (like DBeaver)
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - fraud-network

  # --- MLFLOW TRACKING SERVER ---
  mlflow-server:
    image: python:3.12-slim
    container_name: mlflow-server
    working_dir: /app
    ports:
      - "5000:5000" # MLflow takes port 5000
    command: >
      sh -c "pip install mlflow==2.14.1 setuptools && 
      mlflow server 
      --backend-store-uri sqlite:///mlflow.db 
      --default-artifact-root /app/mlruns 
      --host 0.0.0.0 
      --port 5000"
    volumes:
      - ./mlruns:/app/mlruns
      - ./mlflow.db:/app/mlflow.db
    networks:
      - fraud-network

  # --- INFRASTRUCTURE (Kafka & Redis) ---
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - fraud-network

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      # Listeners for Docker internal and Host external access
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks:
      - fraud-network

  redis:
    image: redis:7.2-bookworm
    container_name: redis
    ports:
      - "6379:6379"
    networks:
      - fraud-network

networks:
  fraud-network:
    driver: bridge